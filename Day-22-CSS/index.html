<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 22 - Login Form</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="form-box">

        <h1>Welcome Back 👋</h1>
        <p>Login to continue your journey</p>

        <form>

            <div class="input-box">
                <input type="email" placeholder="Email Address" required>
            </div>

            <div class="input-box">
                <input type="password" placeholder="Password" required>
            </div>

            <div class="options">
                <label>
                    <input type="checkbox">
                    Remember Me
                </label>

                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit">
                Login
            </button>

        </form>

        <div class="divider">
            OR
        </div>

        <button class="google">
            Continue with Google
        </button>

        <p class="register">
            Don't have an account?
            <a href="#">Register</a>
        </p>

    </div>

</div>

</body>
</html>
